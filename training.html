<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Training — iNat ID trainer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
</head>
<body>
    <header>
        <div>
            <a class="brand" href="main.html">iNat ID trainer</a>
            <h1 id="title">Training</h1>
        </div>
    </header>
    <main>
        <p id="loading">Loading a random specimen...</p>
        <div id="error" style="display:none;"></div>
        <div id="specimen" style="display:none;">
            <div id="carousel">
                <div id="carousel-frame">
                    <button id="photo-prev" aria-label="Previous photo">&lsaquo;</button>
                    <img id="training-image" alt="Training image from iNaturalist" title="Click to zoom">
                    <button id="photo-next" aria-label="Next photo">&rsaquo;</button>
                    <button id="photo-zoom" aria-label="Zoom photo" title="Zoom (full resolution)">&#x2922;</button>
                </div>
                <p id="photo-counter"></p>
            </div>
            <div id="map-panel">
                <div id="map"></div>
                <p id="map-note"></p>
            </div>
        </div>
        <section class="card">
            <p id="info" style="display:none;"></p>
            <form id="guess-form" style="display:none;" autocomplete="off">
                <label for="guess">Your identification</label>
                <div class="guess-row">
                    <input type="text" id="guess" placeholder="Scientific name, e.g. Pararge aegeria">
                    <button type="submit" id="guess-submit" class="primary">Submit</button>
                </div>
            </form>
            <p id="guess-result" style="display:none;"></p>
            <p id="species-id" style="display:none;"></p>
            <div class="button-row">
                <button id="next-btn" class="primary" style="display:none;">Next specimen</button>
                <button id="show-id-btn" style="display:none;">Show ID</button>
                <button id="back-btn">Back to start</button>
            </div>
        </section>
    </main>

    <!-- Full-screen viewer for zooming into the full-resolution photo -->
    <div id="viewer" role="dialog" aria-modal="true" aria-label="Zoomed photo" hidden>
        <div id="viewer-stage">
            <img id="viewer-image" alt="Zoomed training image" draggable="false">
        </div>
        <button id="viewer-prev" class="viewer-nav" aria-label="Previous photo">&lsaquo;</button>
        <button id="viewer-next" class="viewer-nav" aria-label="Next photo">&rsaquo;</button>
        <div id="viewer-toolbar">
            <span id="viewer-counter"></span>
            <span id="viewer-status"></span>
            <button id="viewer-zoom-out" aria-label="Zoom out">&minus;</button>
            <button id="viewer-reset">Fit</button>
            <button id="viewer-zoom-in" aria-label="Zoom in">+</button>
            <button id="viewer-close" aria-label="Close">&times;</button>
        </div>
        <p id="viewer-help">Scroll or pinch to zoom &middot; drag to move &middot; double-click to zoom in/out &middot; Esc to close</p>
    </div>

    <script>
        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name) || '';
        }

        const taxon = getQueryParam('taxon');
        const region = getQueryParam('region');
        // Taxa within the selected one to leave out, e.g. "Papilionoidea, Hesperiidae"
        const excludeNames = getQueryParam('exclude').split(',').map(name => name.trim()).filter(Boolean);
        const lifeStage = getQueryParam('lifestage'); // e.g. "larva"
        let idVisible = false;
        let currentTaxon = null; // taxon of the observation being shown

        // Print regionName for debugging
        console.log('Region from query param:', region);

        const LIFE_STAGE_PLURALS = {
            adult: 'adults', larva: 'larvae', pupa: 'pupae', egg: 'eggs', nymph: 'nymphs',
            juvenile: 'juveniles', teneral: 'tenerals', subimago: 'subimagos'
        };

        function setTitle(taxonName, regionName, excludedNames = []) {
            const excluded = excludedNames.length ? ` (excluding ${excludedNames.join(', ')})` : '';
            const stage = lifeStage ? ` \u2014 ${LIFE_STAGE_PLURALS[lifeStage.toLowerCase()] || lifeStage} only` : '';
            const text = `Training for ${taxonName || 'all organisms'}${excluded} of ${regionName || 'the world'}${stage}`;
            document.getElementById('title').textContent = text;
            document.title = `${text} — iNat ID trainer`;
        }
        setTitle(taxon, region, excludeNames);

        // Fetch JSON from the iNaturalist API, retrying on rate limits (429),
        // server errors (5xx) and network failures with exponential backoff.
        async function fetchJSON(url, retries = 4) {
            for (let attempt = 0; ; attempt++) {
                let status;
                try {
                    const response = await fetch(url);
                    if (response.ok) return await response.json();
                    status = response.status;
                    // Client errors other than rate limiting won't fix themselves
                    if (status !== 429 && status < 500) {
                        throw Object.assign(new Error(`iNaturalist API returned HTTP ${status}`), { fatal: true });
                    }
                } catch (err) {
                    if (err.fatal || attempt >= retries) throw err;
                }
                if (attempt >= retries) {
                    throw new Error(`iNaturalist API returned HTTP ${status} after ${retries + 1} attempts`);
                }
                const delay = 1000 * 2 ** attempt + Math.random() * 500;
                console.warn(`Request failed (${status ?? 'network error'}), retrying in ${Math.round(delay)} ms`);
                await new Promise(resolve => setTimeout(resolve, delay));
            }
        }

        async function fetchPlaceID(regionName) {
            const data = await fetchJSON(`https://api.inaturalist.org/v1/places/autocomplete?q=${encodeURIComponent(regionName)}`);
            if (!data.results || data.results.length === 0) {
                throw new Error(`No matching place found for "${regionName}"`);
            }
            return data.results[0]; // Return the first matching place
        }

        async function fetchTaxonID(taxonName) {
            const data = await fetchJSON(`https://api.inaturalist.org/v1/taxa/autocomplete?q=${encodeURIComponent(taxonName)}`);
            if (!data.results || data.results.length === 0) {
                throw new Error(`No matching taxon found for "${taxonName}"`);
            }
            return data.results[0]; // Return the first matching taxon
        }

        // Find a taxon to exclude. The search is limited to descendants of the selected taxon,
        // and only an exact name match is accepted: autocomplete is fuzzy, so e.g. "Aves"
        // within Lepidoptera would otherwise match the moth Pseudergolis avesta.
        async function fetchExcludedTaxon(name, parentTaxon) {
            const data = await fetchJSON('https://api.inaturalist.org/v1/taxa/autocomplete'
                + `?q=${encodeURIComponent(name)}&taxon_id=${parentTaxon.id}&per_page=30`);
            const wanted = normalizeName(name);
            const match = (data.results || []).find(t =>
                normalizeName(t.name) === wanted || (t.matched_term && normalizeName(t.matched_term) === wanted));
            if (!match) {
                throw new Error(`Couldn't find a taxon called "${name}" within ${parentTaxon.name} to exclude. Check the spelling.`);
            }
            return match;
        }

        // Look up the annotation IDs for a life stage name, e.g. "larva" -> term 1, value 6
        async function fetchLifeStageFilter(name) {
            const data = await fetchJSON('https://api.inaturalist.org/v1/controlled_terms');
            const term = (data.results || []).find(t => t.label === 'Life Stage');
            const value = term && term.values.find(v => v.label.toLowerCase() === name.toLowerCase());
            if (!value) throw new Error(`Unknown life stage "${name}"`);
            return { termId: term.id, valueId: value.id };
        }

        const PER_PAGE = 50;
        const MAX_RESULTS = 10000; // the API refuses pages beyond page * per_page > 10000
        let placeId, taxonId, totalResults;
        let excludedIds = [];
        let lifeStageFilter = null; // { termId, valueId } when filtering by life stage
        let queue = []; // observations fetched but not yet shown
        let photoUrls = []; // photos of the observation being shown (medium size)
        let photoOriginalUrls = []; // the same photos at full resolution, for the zoom viewer
        let photoIndex = 0;

        let map, mapLayers;

        // Show the observation's location: a point plus a circle for its positional
        // accuracy, which for obscured observations covers the area the true point is in
        function showLocation(obs) {
            const mapEl = document.getElementById('map');
            const note = document.getElementById('map-note');
            if (!obs.location) {
                mapEl.style.display = 'none';
                note.textContent = 'This observation has no location.';
                return;
            }
            mapEl.style.display = 'block';
            if (!map) {
                map = L.map('map');
                // These tile servers, unlike tile.openstreetmap.org, don't require a Referer
                // header, so the map also works when the page is opened as a local file
                const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services';
                const baseLayers = {
                    'Map': L.tileLayer(`${esri}/World_Topo_Map/MapServer/tile/{z}/{y}/{x}`, {
                        maxZoom: 19,
                        attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, USGS, NGA, and the GIS user community'
                    }),
                    'Terrain': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                        maxZoom: 17,
                        attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Style &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
                    }),
                    'Satellite': L.tileLayer(`${esri}/World_Imagery/MapServer/tile/{z}/{y}/{x}`, {
                        maxZoom: 19,
                        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS user community'
                    })
                };
                baseLayers['Map'].addTo(map);
                L.control.layers(baseLayers).addTo(map);
                L.control.scale().addTo(map);
                mapLayers = L.layerGroup().addTo(map);
            }
            map.invalidateSize(); // the map may have been laid out while hidden

            const [lat, lng] = obs.location.split(',').map(Number);
            const accuracy = obs.public_positional_accuracy;
            mapLayers.clearLayers();
            L.circleMarker([lat, lng], { radius: 6, color: '#fff', weight: 2, fillColor: '#d9534f', fillOpacity: 1 })
                .addTo(mapLayers);
            map.setView([lat, lng], 6, { animate: false });
            if (accuracy) {
                const circle = L.circle([lat, lng], { radius: accuracy, color: '#d9534f', weight: 1, fillOpacity: 0.15 })
                    .addTo(mapLayers);
                // Zoom out further if the accuracy circle doesn't fit at the default zoom
                // (skipped if the map has no size yet, e.g. in a hidden tab, which would zoom out to the whole world)
                const size = map.getSize();
                if (size.x > 0 && size.y > 0 && !map.getBounds().contains(circle.getBounds())) {
                    map.fitBounds(circle.getBounds(), { animate: false, maxZoom: 6 });
                }
            }

            const accuracyText = accuracy
                ? `accurate to ${accuracy >= 1000 ? (accuracy / 1000).toFixed(1) + ' km' : accuracy + ' m'}`
                : 'accuracy unknown';
            note.textContent = obs.obscured
                ? `Location obscured: the true point is somewhere in the shaded area (${accuracyText}).`
                : `Location ${accuracyText}.`;
        }

        function showPhoto(index) {
            photoIndex = (index + photoUrls.length) % photoUrls.length;
            document.getElementById('training-image').src = photoUrls[photoIndex];
            document.getElementById('photo-counter').textContent = `Photo ${photoIndex + 1} of ${photoUrls.length}`;
            if (viewerOpen()) showViewerPhoto();
        }

        // ---------- Zoom viewer ----------

        const viewer = document.getElementById('viewer');
        const viewerImage = document.getElementById('viewer-image');
        // If the Panzoom library failed to load, the rest of the trainer still works, just without zoom.
        // (Panzoom's own contain: 'outside' option is not used: it miscalculates the minimum scale once
        // zoomed, so the photo can get stuck zoomed in. clampPan() keeps the photo in view instead.)
        const panzoom = window.Panzoom
            ? Panzoom(viewerImage, { maxScale: 8, minScale: 1, step: 0.4 })
            : null;
        if (!panzoom) {
            document.getElementById('photo-zoom').hidden = true;
            document.getElementById('training-image').title = '';
        }
        let viewerOpener = null; // element to give focus back to on close

        function viewerOpen() {
            return !viewer.hidden;
        }

        // Pull the photo back if it has been dragged or zoomed out past its edges. The bounds use the
        // photo itself rather than the letterboxed element, so e.g. a portrait photo stays centred
        // horizontally until it is zoomed wider than the screen.
        function clampPan(animate = true) {
            const stage = document.getElementById('viewer-stage');
            const width = stage.clientWidth, height = stage.clientHeight;
            const ratio = viewerImage.naturalWidth && viewerImage.naturalHeight
                ? viewerImage.naturalWidth / viewerImage.naturalHeight
                : width / height;
            const photoWidth = Math.min(width, height * ratio), photoHeight = Math.min(height, width / ratio);
            const scale = panzoom.getScale(), pan = panzoom.getPan();
            // Panzoom renders "scale(s) translate(x, y)", so a pan of x moves the photo by s * x on screen
            const maxX = Math.max(0, (scale * photoWidth - width) / 2) / scale;
            const maxY = Math.max(0, (scale * photoHeight - height) / 2) / scale;
            const x = Math.min(maxX, Math.max(-maxX, pan.x));
            const y = Math.min(maxY, Math.max(-maxY, pan.y));
            if (x !== pan.x || y !== pan.y) panzoom.pan(x, y, { animate });
        }

        // Run a zoom action, then keep the photo in view
        function zoomAnd(action) {
            action();
            clampPan();
        }

        // Show the current photo in the viewer: the medium image straight away (already loaded),
        // then the full-resolution one once it has downloaded
        function showViewerPhoto() {
            const index = photoIndex;
            panzoom.reset({ animate: false });
            viewerImage.src = photoUrls[index];
            const multiple = photoUrls.length > 1;
            document.getElementById('viewer-counter').textContent = multiple ? `Photo ${index + 1} of ${photoUrls.length}` : '';
            document.getElementById('viewer-prev').hidden = !multiple;
            document.getElementById('viewer-next').hidden = !multiple;

            const status = document.getElementById('viewer-status');
            status.textContent = 'Loading full resolution\u2026';
            const full = new Image();
            full.onload = () => {
                if (index !== photoIndex || !viewerOpen()) return; // user moved on meanwhile
                viewerImage.src = full.src;
                status.textContent = '';
            };
            full.onerror = () => {
                if (index === photoIndex) status.textContent = 'Full resolution unavailable';
            };
            full.src = photoOriginalUrls[index];
        }

        function openViewer() {
            if (!panzoom || !photoUrls.length) return;
            viewerOpener = document.activeElement;
            viewer.hidden = false;
            document.body.classList.add('viewer-active');
            showViewerPhoto();
            document.getElementById('viewer-close').focus();
        }

        function closeViewer() {
            if (!viewerOpen()) return;
            viewer.hidden = true;
            document.body.classList.remove('viewer-active');
            if (viewerOpener && viewerOpener.focus) viewerOpener.focus({ preventScroll: true });
        }

        document.getElementById('training-image').addEventListener('click', openViewer);
        document.getElementById('photo-zoom').addEventListener('click', openViewer);
        document.getElementById('viewer-close').addEventListener('click', closeViewer);
        document.getElementById('viewer-zoom-in').addEventListener('click', () => zoomAnd(() => panzoom.zoomIn()));
        document.getElementById('viewer-zoom-out').addEventListener('click', () => zoomAnd(() => panzoom.zoomOut()));
        document.getElementById('viewer-reset').addEventListener('click', () => panzoom.reset());
        document.getElementById('viewer-prev').addEventListener('click', () => showPhoto(photoIndex - 1));
        document.getElementById('viewer-next').addEventListener('click', () => showPhoto(photoIndex + 1));
        // A larger step than the buttons' so one mouse-wheel notch zooms ~35% (trackpads send many small events)
        document.getElementById('viewer-stage').addEventListener('wheel', event => {
            zoomAnd(() => panzoom.zoomWithWheel(event, { step: 0.9 }));
        }, { passive: false });
        viewerImage.addEventListener('dblclick', event => {
            if (panzoom.getScale() > 1.05) panzoom.reset();
            else zoomAnd(() => panzoom.zoomToPoint(3, event));
        });
        // After a drag or pinch, and when the window is resized or the full-resolution photo arrives
        viewerImage.addEventListener('panzoomend', () => clampPan());
        viewerImage.addEventListener('load', () => { if (viewerOpen()) clampPan(false); });
        window.addEventListener('resize', () => { if (viewerOpen()) clampPan(false); });
        // Clicking the dark background around the photo closes the viewer
        document.getElementById('viewer-stage').addEventListener('click', event => {
            if (event.target.id === 'viewer-stage') closeViewer();
        });

        function observationsURL(extraParams) {
            return 'https://api.inaturalist.org/v1/observations'
                + '?taxon_id=' + taxonId
                + '&place_id=' + placeId
                + '&verifiable=true'
                + '&quality_grade=research'
                + '&photos=true'
                + '&order_by=random'
                + (excludedIds.length ? '&without_taxon_id=' + excludedIds.join(',') : '')
                + (lifeStageFilter ? `&term_id=${lifeStageFilter.termId}&term_value_id=${lifeStageFilter.valueId}` : '')
                + extraParams;
        }

        // Fill the queue with a batch of observations from a random page
        async function refillQueue() {
            if (totalResults === undefined) {
                const countData = await fetchJSON(observationsURL('&per_page=0'));
                totalResults = countData.total_results;
            }
            if (!totalResults) {
                throw new Error('No observations found matching your criteria');
            }
            const lastPage = Math.max(1, Math.ceil(Math.min(totalResults, MAX_RESULTS) / PER_PAGE));
            const page = Math.floor(Math.random() * lastPage) + 1;
            const data = await fetchJSON(observationsURL(`&per_page=${PER_PAGE}&page=${page}`));
            const results = (data.results || []).filter(obs => obs.photos && obs.photos.length > 0);
            // Shuffle so consecutive specimens aren't in API order
            for (let i = results.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [results[i], results[j]] = [results[j], results[i]];
            }
            queue = results;
        }

        async function fetchRandomObservation() {
            try {
                const loading = document.getElementById('loading');
                const error = document.getElementById('error');
                const specimen = document.getElementById('specimen');
                const info = document.getElementById('info');
                const speciesIdEl = document.getElementById('species-id');
                const nextBtn = document.getElementById('next-btn');
                const showIdBtn = document.getElementById('show-id-btn');

                loading.style.display = 'flex';
                error.style.display = 'none';
                specimen.style.display = 'none';
                info.style.display = 'none';
                speciesIdEl.style.display = 'none';
                nextBtn.style.display = 'none';
                showIdBtn.style.display = 'none';
                showIdBtn.textContent = 'Show ID';
                closeViewer();
                idVisible = false;
                resetGuess(false);

                if (placeId === undefined || taxonId === undefined) {
                    const place = await fetchPlaceID(region);
                    const matchedTaxon = await fetchTaxonID(taxon);
                    const excludedTaxa = [];
                    for (const name of excludeNames) {
                        excludedTaxa.push(await fetchExcludedTaxon(name, matchedTaxon));
                    }
                    if (lifeStage) lifeStageFilter = await fetchLifeStageFilter(lifeStage);
                    placeId = place.id;
                    taxonId = matchedTaxon.id;
                    excludedIds = excludedTaxa.map(t => t.id);
                    // Show what iNaturalist actually matched, which may differ from what was typed
                    setTitle(matchedTaxon.name, place.display_name, excludedTaxa.map(t => t.name));
                }
                console.log('Using place ID:', placeId, 'taxon ID:', taxonId, 'excluded taxon IDs:', excludedIds);

                if (queue.length === 0) await refillQueue();
                if (queue.length === 0) {
                    throw new Error('No observations with photos found matching your criteria');
                }
                const randomObs = queue.pop();

                photoUrls = randomObs.photos.map(photo => photo.url.replace('square', 'medium'));
                photoOriginalUrls = randomObs.photos.map(photo => photo.url.replace('square', 'original'));
                const multiple = photoUrls.length > 1;
                document.getElementById('photo-prev').style.visibility = multiple ? 'visible' : 'hidden';
                document.getElementById('photo-next').style.visibility = multiple ? 'visible' : 'hidden';
                document.getElementById('photo-counter').style.display = multiple ? 'block' : 'none';
                showPhoto(0);
                // Preload the other photos so flipping through them is instant
                photoUrls.slice(1).forEach(url => { new Image().src = url; });
                specimen.style.display = 'flex';
                showLocation(randomObs);
                loading.style.display = 'none';
                nextBtn.style.display = 'inline-block';
                showIdBtn.style.display = 'inline-block';
                currentTaxon = randomObs.taxon || null;
                resetGuess(true);

                // Display species ID (initially hidden)
                // Scientific name of the community identification; italicise genus and below
                const obsTaxon = randomObs.taxon;
                const speciesName = obsTaxon?.name || randomObs.species_guess || 'Unknown species';
                const nameEl = document.createElement('strong');
                if (obsTaxon && obsTaxon.rank_level <= 20) {
                    const em = document.createElement('em');
                    em.textContent = speciesName;
                    nameEl.appendChild(em);
                } else {
                    nameEl.textContent = speciesName;
                }
                speciesIdEl.replaceChildren(nameEl);
                
                // Display info without species name
                const date = new Date(randomObs.observed_on).toLocaleDateString();
                const obsUrl = `https://www.inaturalist.org/observations/${randomObs.id}`;
                info.innerHTML = `Observed: ${date} | <a href="${obsUrl}" target="_blank">View observation</a>`;
                info.style.display = 'block';

            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').textContent = `Error: ${err.message}`;
                document.getElementById('error').style.display = 'block';
                // Let the user retry without reloading the page
                document.getElementById('next-btn').style.display = 'inline-block';
                console.error(err);
            }
        }

        function setIdVisible(visible) {
            idVisible = visible;
            document.getElementById('species-id').style.display = idVisible ? 'block' : 'none';
            document.getElementById('show-id-btn').textContent = idVisible ? 'Hide ID' : 'Show ID';
        }

        document.getElementById('show-id-btn').addEventListener('click', () => setIdVisible(!idVisible));

        // Lowercase, strip accents and collapse whitespace so trivial differences don't count
        function normalizeName(name) {
            return name.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .toLowerCase().replace(/\s+/g, ' ').trim();
        }

        // Returns { outcome: 'correct' | 'close' | 'wrong', message }
        function checkGuess(guess, obsTaxon) {
            const answer = normalizeName(obsTaxon.name);
            const answerWords = answer.split(' ');
            const guessWords = guess.split(' ');
            const accepted = [answer];
            // A species name is also right for an observation identified to subspecies
            if (obsTaxon.rank_level < 10) accepted.push(answerWords.slice(0, 2).join(' '));
            if (obsTaxon.preferred_common_name) accepted.push(normalizeName(obsTaxon.preferred_common_name));
            if (accepted.includes(guess)) return { outcome: 'correct', message: 'Correct!' };

            // Partial matches only make sense for genus and below, whose names start with the genus
            if (obsTaxon.rank_level <= 20 && guessWords[0] === answerWords[0]) {
                if (answerWords.length === 1) {
                    return { outcome: 'close', message: 'Close: right genus, but this observation is only identified to genus level.' };
                }
                if (answerWords.length === 3 && guessWords[1] === answerWords[1]) {
                    return { outcome: 'close', message: 'Close: right species, but not the right subspecies.' };
                }
                return { outcome: 'close', message: 'Close: right genus, but not the right species.' };
            }
            return { outcome: 'wrong', message: 'Not quite.' };
        }

        // Clear the previous guess; show the form only when there is a specimen to guess
        function resetGuess(show) {
            const input = document.getElementById('guess');
            input.value = '';
            input.disabled = false;
            document.getElementById('guess-submit').disabled = false;
            document.getElementById('guess-result').style.display = 'none';
            document.getElementById('guess-form').style.display = show && currentTaxon ? 'block' : 'none';
            if (show && currentTaxon) input.focus({ preventScroll: true }); // keep the photo in view on small screens
        }

        document.getElementById('guess-form').addEventListener('submit', event => {
            event.preventDefault();
            const input = document.getElementById('guess');
            const guess = normalizeName(input.value);
            if (!guess || !currentTaxon) return;

            const { outcome, message } = checkGuess(guess, currentTaxon);
            const resultEl = document.getElementById('guess-result');
            resultEl.className = outcome;
            resultEl.textContent = `${message} The answer is shown below.`;
            resultEl.style.display = 'block';

            input.disabled = true;
            document.getElementById('guess-submit').disabled = true;
            setIdVisible(true);
            // Pressing Enter again moves on to the next specimen
            document.getElementById('next-btn').focus();
        });

        document.getElementById('photo-prev').addEventListener('click', () => showPhoto(photoIndex - 1));
        document.getElementById('photo-next').addEventListener('click', () => showPhoto(photoIndex + 1));
        document.addEventListener('keydown', event => {
            if (viewerOpen()) {
                if (event.key === 'Escape') closeViewer();
                else if (event.key === 'ArrowLeft') showPhoto(photoIndex - 1);
                else if (event.key === 'ArrowRight') showPhoto(photoIndex + 1);
                else if (event.key === '+' || event.key === '=') zoomAnd(() => panzoom.zoomIn());
                else if (event.key === '-') zoomAnd(() => panzoom.zoomOut());
                else if (event.key === '0') panzoom.reset();
                else if (event.key === 'Tab') trapFocus(event);
                else return;
                if (event.key !== 'Tab') event.preventDefault();
                return;
            }
            if (document.getElementById('specimen').style.display === 'none' || photoUrls.length < 2) return;
            if (event.target.closest('#map')) return; // arrow keys pan the map when it has focus
            if (event.target.matches('input, textarea')) return; // arrow keys move the text cursor
            if (event.key === 'ArrowLeft') showPhoto(photoIndex - 1);
            if (event.key === 'ArrowRight') showPhoto(photoIndex + 1);
        });

        // Keep keyboard focus inside the viewer while it is open
        function trapFocus(event) {
            const focusable = [...viewer.querySelectorAll('button')].filter(b => !b.hidden);
            const first = focusable[0], last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) { last.focus(); event.preventDefault(); }
            else if (!event.shiftKey && document.activeElement === last) { first.focus(); event.preventDefault(); }
        }

        document.getElementById('next-btn').addEventListener('click', () => fetchRandomObservation());

        document.getElementById('back-btn').addEventListener('click', function() {
            window.location.href = 'main.html';
        });
        
        fetchRandomObservation();

    </script>
</body>
</html>
